name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yor_store
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/yor_store
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      CRON_SECRET: ci-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Scrape authorization contract
        run: npm run security:check
      - name: Design contract
        run: npm run design:check
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Production build
        run: npm run build
